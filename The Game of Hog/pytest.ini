[pytest]
# Run the Hog tests with pytest-grader:
#   python3 -m pytest --score      run all tests and show your score
#   python3 -m pytest -k q01       run one question (e.g. Question 1)
#   python3 -m pytest --unlock     unlock locked tests interactively
addopts = --doctest-modules --disable-plugin-autoload
testpaths = tests
